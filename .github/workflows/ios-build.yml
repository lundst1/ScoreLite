# Kompileringskontroll av iOS-koden (decisions #26, #32). Bygger mot simulatorn utan signering.
# Provar inte ljud, UI eller prestanda: det kräver en riktig iPhone (docs/device-checklist.md).
name: ios-build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Miljö
        run: |
          dotnet --info
          xcodebuild -version
          xcode-select -p

      # iOS-workloaden kräver en viss Xcode-version. Lista installerade och välj den högsta.
      - name: Välj Xcode
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app
          best=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Väljer: $best"
          [ -n "$best" ] && sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version

      - name: Diagnos (Xcode och workload-set)
        shell: bash
        continue-on-error: true
        run: |
          echo "::notice title=Xcode installerade::$(ls -d /Applications/Xcode*.app | tr '
' ' ')"
          echo "::notice title=Xcode aktiv::$(xcodebuild -version | tr '
' ' ')"
          echo "::notice title=Workload-set::$(dotnet workload search version --take 12 2>&1 | tr '
' ' ' | cut -c1-900)"

      # Restore utvärderar alla målramverk (Android och iOS på macOS), så båda workloads krävs även när bara iOS byggs.
      # Ett globalt -p:TargetFrameworks=... fungerar inte: det smittar projektreferenserna (net8.0).
      - name: Installera MAUI-workloads
        run: dotnet workload install maui-ios maui-android

      - name: Enhetstester (net8.0)
        shell: bash
        run: |
          set +e
          fail=0
          for t in Core Audio App; do
            dotnet run --project tests/ScoreLite.$t.Tests -c Release 2>&1 | tee test-$t.log
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              fail=1
              # Lyft fram de sista raderna (felen) som annoteringar.
              tail -15 test-$t.log | while IFS= read -r line; do echo "::error::[$t] ${line:0:800}"; done
            fi
          done
          exit $fail

      - name: Bygg iOS (simulator, utan signering)
        shell: bash
        run: |
          set +e
          dotnet build src/ScoreLite.App/ScoreLite.App.csproj             -f net10.0-ios -c Debug             -p:RuntimeIdentifier=iossimulator-arm64             -p:EnableCodeSigning=false             -p:CodesignRequireProvisioningProfile=false             -bl:build.binlog 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Lyft fram felen som annoteringar så att de syns utan att öppna hela loggen.
            grep -E "error [A-Za-z]+[0-9]*:|: error " build.log | sort -u | head -20 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
          fi
          exit $code

      - name: Spara bygglogg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            build.log
            test-*.log
            build.binlog
